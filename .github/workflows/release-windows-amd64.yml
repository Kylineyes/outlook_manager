name: 发布 Windows 和 Linux amd64 压缩包

# 触发条件：推送以 v 开头的标签，例如 v0.1.0。
# 工作流会先校验标签是否位于 main 分支的提交历史中，避免误发布未合并代码。
on:
  push:
    tags:
      - 'v*'

# 创建 GitHub Release 需要写入 contents 权限。
permissions:
  contents: write

jobs:
  # 第一个任务：确认标签提交属于 main 分支。
  verify-tag:
    name: 校验标签是否位于 main 分支
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: 检出完整提交历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验标签提交是否属于 main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "标签提交属于 main 分支，可以继续发布。"
          else
            echo "::error::标签 $GITHUB_REF_NAME 指向的提交不在 main 分支上，终止发布。"
            exit 1
          fi

      - name: 输出标签名
        id: tag
        shell: bash
        run: echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  # Windows amd64 构建：zip 内包含 outlookctl.exe 和 outlook-mcp.exe。
  build-windows:
    name: 构建 Windows amd64 压缩包
    needs: verify-tag
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify-tag.outputs.tag }}
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: 构建并压缩
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows, dist | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=$env:VERSION" -o build/windows/outlookctl.exe ./cmd/outlookctl
          go build -trimpath -ldflags "-s -w -X main.version=$env:VERSION" -o build/windows/outlook-mcp.exe ./cmd/outlook-mcp
          Compress-Archive -Path build/windows/outlookctl.exe,build/windows/outlook-mcp.exe -DestinationPath "dist/outlook-manager-windows-amd64-x64-$env:VERSION.zip" -Force
          Get-ChildItem dist | Format-Table Name,Length

      - name: 上传 Windows 压缩包
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-x64
          path: dist/outlook-manager-windows-amd64-x64-*.zip
          if-no-files-found: error

  # Linux amd64 构建：zip 内包含 outlookctl 和 outlook-mcp。
  build-linux:
    name: 构建 Linux amd64 压缩包
    needs: verify-tag
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify-tag.outputs.tag }}
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: 安装 zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: 构建并压缩
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/linux dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o build/linux/outlookctl ./cmd/outlookctl
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o build/linux/outlook-mcp ./cmd/outlook-mcp
          chmod +x build/linux/outlookctl build/linux/outlook-mcp
          cd build/linux
          zip -j "../../dist/outlook-manager-linux-amd64-x64-${VERSION}.zip" outlookctl outlook-mcp
          cd ../..
          ls -l dist

      - name: 上传 Linux 压缩包
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-x64
          path: dist/outlook-manager-linux-amd64-x64-*.zip
          if-no-files-found: error

  # 汇总两个平台的压缩包并挂到同一个 GitHub Release。
  release:
    name: 创建 GitHub Release
    needs:
      - verify-tag
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部压缩包
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-tag.outputs.tag }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true