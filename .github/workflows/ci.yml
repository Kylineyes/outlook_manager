name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test:
    name: 测试、覆盖率与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 静态检查
        run: go vet ./...

      - name: 竞态测试与覆盖率
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: 解析器 fuzz 冒烟测试
        run: |
          go test -run=^$ -fuzz=FuzzReadContacts -fuzztime=2s ./internal/contactcsv
          go test -run=^$ -fuzz=FuzzReadContacts -fuzztime=2s ./internal/vcard
          go test -run=^$ -fuzz=FuzzParse -fuzztime=2s ./internal/eml
          go test -run=^$ -fuzz=FuzzParse -fuzztime=2s ./internal/ics

      - name: 构建 Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -o dist/outlookctl-windows-amd64.exe ./cmd/outlookctl
          go build -trimpath -o dist/outlook-mcp-windows-amd64.exe ./cmd/outlook-mcp

      - name: 上传覆盖率
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error